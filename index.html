  <title>REŽIM – tvůj osobní kouč</title>
  <style>
    :root{color-scheme:dark;--bg:#0b111a;--panel:#141e2b;--panel-2:#1a2635;--border:#2a3849;--muted:#9aaec2;--text:#edf5ff;--mint:#6cf2b0;--cyan:#68d4f9;--orange:#ffba6a;--red:#ff7c7c;--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% -6%,#19324b 0,transparent 31%),var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;color:var(--text);line-height:1.45;min-height:100vh}
    button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
    .app{max-width:840px;padding:24px 18px 115px;margin:auto}.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:20px}.logo{letter-spacing:.23em;font-size:13px;font-weight:900;color:var(--mint)}.top h1{margin:6px 0 2px;font-size:clamp(26px,6vw,39px);line-height:1.08;letter-spacing:-.05em}.muted,.sub{color:var(--muted)}.sub{font-size:14px}.pill{border:1px solid #38535a;border-radius:50px;padding:10px 13px;background:#18302f;color:var(--mint);white-space:nowrap;font-weight:800;font-size:13px}
    .hero{background:linear-gradient(130deg,#182b37,#142030 60%,#1b2638);border:1px solid #354758;border-radius:28px;padding:22px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:15px;box-shadow:0 14px 40px #0003}
    .eyebrow{text-transform:uppercase;font-size:11px;letter-spacing:.15em;color:var(--cyan);font-weight:900}.hero h2{font-size:clamp(24px,6vw,35px);letter-spacing:-.04em;margin:8px 0 4px}.hero p{margin:0;color:var(--muted);font-size:14px}.progress-circle{width:112px;height:112px;border-radius:100%;padding:11px;display:grid;place-items:center;flex-shrink:0}.progress-circle>div{display:flex;align-items:center;justify-content:center;flex-direction:column;background:#152330;width:100%;height:100%;border-radius:50%}.progress-circle strong{font-size:30px;line-height:1}.progress-circle small{font-size:11px;color:var(--muted)}
    .statrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:13px 0 24px}.stat{background:#141f2d;border:1px solid var(--border);border-radius:17px;padding:12px}.stat b{font-size:24px;display:block;letter-spacing:-.04em}.stat small{font-size:11px;color:var(--muted)}.sectionTitle{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:23px 1px 12px}.sectionTitle h2{font-size:20px;letter-spacing:-.035em;margin:0}.sectionTitle small{font-size:12px;color:var(--muted)}
    .stack{display:grid;gap:11px}.habit{border:1px solid var(--border);background:var(--panel);padding:17px;border-radius:20px;display:grid;grid-template-columns:48px 1fr;gap:13px;align-items:start}.habit.done{border-color:#346450;background:linear-gradient(105deg,#172a2a,#162330)}.emoji{width:46px;height:46px;display:grid;place-items:center;font-size:24px;border-radius:15px;background:#26374a}.habit h3{margin:0;font-size:16px}.habit p{margin:3px 0 11px;color:var(--muted);font-size:13px}.habit .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.status{font-size:11px;color:var(--mint);font-weight:800}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.btn{border:1px solid #43566b;color:var(--text);padding:10px 14px;border-radius:12px;background:#26364a;font-weight:750;min-height:42px}.btn:active{transform:scale(.98)}.btn.primary{background:var(--mint);border-color:var(--mint);color:#092220}.btn.outline{background:transparent}.btn.orange{background:#513b27;border-color:#6d5236;color:#ffd29b}.btn.red{background:#442a35;border-color:#70414c;color:#ffd5d5}.btn.mini{min-width:42px;padding:8px 11px}.metric{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}.meter{height:7px;background:#273648;border-radius:20px;overflow:hidden;margin:10px 0}.meter>span{height:100%;background:linear-gradient(90deg,#55d4a1,var(--mint));display:block;border-radius:20px;transition:width .25s}.food-grid{display:flex;gap:7px;flex-wrap:wrap}.food-button{border:1px solid #425469;border-radius:12px;background:#233246;color:var(--text);padding:8px 10px;font-size:12px;font-weight:750}.food-button.yes{color:#0d2d21;background:var(--mint);border-color:var(--mint)}
    .tip{display:flex;align-items:start;gap:13px;border-radius:20px;padding:16px 18px;border:1px solid #465149;background:#202b27;margin-top:14px}.tip b{color:#c4ffde}.tip p{color:#c2d0c9;font-size:13px;margin:5px 0 0}.smalltext{font-size:12px;color:var(--muted)}.quote{font-size:17px;font-weight:730;letter-spacing:-.02em}.footer-note{font-size:12px;color:#8498ac;text-align:center;margin:30px 0}
    .bottomnav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom));background:#101a26ed;backdrop-filter:blur(17px);border-top:1px solid var(--border)}.bottomnav>div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;width:min(800px,100%)}.tab{background:none;border:0;border-radius:13px;padding:8px 2px;color:#9aaec2;font-weight:760;display:grid;justify-items:center;gap:2px;font-size:11px}.tab span{font-size:20px}.tab.active{background:#243746;color:var(--mint)}
    .week-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;align-items:end}.week-day{min-width:0;text-align:center}.week-day .bar-bg{height:135px;border-radius:11px;background:#202f40;display:flex;align-items:end;overflow:hidden}.week-day .bar{width:100%;background:linear-gradient(#77efb7,#239c81);border-radius:10px 10px 0 0;min-height:2px}.week-day label{display:block;color:var(--muted);font-size:11px;margin-top:8px}.week-day b{display:block;font-size:11px;margin-bottom:5px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:19px;margin-bottom:14px}.panel h2{font-size:18px;margin:0 0 15px}.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px}.divider{height:1px;background:var(--border);margin:15px 0}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px}.field label{font-weight:780;font-size:12px;color:#b9cce0}.field input{background:#0b1520;border:1px solid #405168;color:var(--text);border-radius:11px;padding:11px 10px;width:100%;min-width:0;accent-color:var(--mint)}.day-checks{display:flex;flex-wrap:wrap;gap:7px}.day-checks label{display:flex;align-items:center;gap:5px;background:#223244;border:1px solid #405368;padding:8px;border-radius:9px;font-size:12px}.day-checks input{accent-color:var(--mint)}.help{font-size:12px;color:var(--muted);margin-top:10px}.w-full{width:100%}.inline-input{max-width:94px;background:#0b1520;border:1px solid #405168;color:#fff;border-radius:9px;padding:9px;font-variant-numeric:tabular-nums}.warning{color:#ffd29b;font-size:12px}.happy{color:var(--mint)}
    .run-record{background:#101e2c;border:1px solid #33475d;border-radius:14px;padding:12px;margin:12px 0}
    .run-record .settings-grid{gap:10px;margin-bottom:10px}
    .run-record .field label{color:#c7d8e8}
    .run-record input{background:#0b1520;border:1px solid #405168;color:#fff;border-radius:10px;padding:10px;width:100%;min-width:0}
    .run-log{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
    .run-log span{font-size:11px;color:#c5d8ed;background:#24374b;border-radius:8px;padding:6px 8px}
    .wake-row{margin:10px 0}
    .wake-row .field{max-width:220px}
    .wake-row input{background:#0b1520;border:1px solid #405168;color:#fff;border-radius:10px;padding:10px;max-width:175px;color-scheme:dark}
    .status.missed{color:var(--orange)}
    .daily-mottos{display:grid;gap:11px}
    .daily-motto{margin:0;font-size:15px;color:#e2f9f2;line-height:1.45;border-left:3px solid #69cdaa;padding-left:11px}
    .bible-card{background:linear-gradient(125deg,#2c2837,#1a2736);border:1px solid #756348;border-radius:20px;padding:20px;margin:16px 0}
    .bible-label{font-size:12px;font-weight:900;color:#ffe2a2;letter-spacing:.04em}.bible-card blockquote{margin:12px 0 8px;padding:0;border:0;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.5;color:#fff4d9}.bible-ref{font-size:12px;color:#bfc9d8}.bible-source{color:#b6e6fc;font-size:12px;text-decoration:underline;text-underline-offset:3px;align-self:center}.bible-card .help{margin-bottom:0}
    .reward-mini{border:1px solid #4c5e54;background:#1b2d2b;border-radius:13px;padding:11px 14px;font-size:13px;color:#d5f9e5;margin:-9px 0 20px}.reward-mini span{display:block;color:#a9cabc;font-size:11px;margin-top:4px}.medals{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.medal{font-size:12px;border:1px solid #3b4a5c;background:#202e3e;color:#96a7b8;padding:9px 11px;border-radius:11px}.medal.unlocked{border-color:#947c44;color:#ffe6a8;background:#3c3325}
    .supplement-settings{display:grid;gap:13px;margin:14px 0}.supplement-line{display:flex;gap:14px;justify-content:space-between;align-items:center;background:#202e3e;border:1px solid var(--border);border-radius:13px;padding:12px}.supplement-line>label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:9px}.supplement-line>label input{width:19px;height:19px;accent-color:var(--mint)}.supplement-line .field{max-width:125px}
    .modal-overlay{position:fixed;z-index:30;inset:0;background:#030b13ed;display:grid;place-items:center;padding:22px;backdrop-filter:blur(12px)}.modal{width:min(430px,100%);background:#1a2837;border:1px solid #3d5565;border-radius:27px;padding:26px;text-align:center}.modal .big{font-size:47px}.modal h2{font-size:29px;line-height:1.15;margin:10px 0}.modal p{color:var(--muted);font-size:14px}.tap{background:var(--mint);border:0;color:#07251d;font-weight:950;border-radius:70px;width:140px;height:140px;font-size:22px;margin:10px auto;display:block;box-shadow:0 0 0 11px #6cf2b020}.modal .counter{font-size:14px;font-weight:800;color:var(--mint)}.toast{z-index:50;position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#ecfff6;color:#103b2d;font-weight:800;padding:12px 18px;border-radius:15px;max-width:92%;box-shadow:0 10px 30px #0007;text-align:center}.hidden{display:none!important}
    @media(max-width:440px){.app{padding:19px 13px 112px}.hero{padding:18px;gap:8px}.progress-circle{width:94px;height:94px;padding:9px}.progress-circle strong{font-size:25px}.pill{font-size:11px;padding:9px}.habit{padding:14px;grid-template-columns:42px 1fr;gap:11px}.emoji{width:41px;height:41px}.btn{font-size:13px}.stat{padding:11px 8px}.stat b{font-size:21px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}

<body>
  <div class="app" id="app"></div>
  <nav class="bottomnav" aria-label="Hlavní navigace"><div id="nav"></div></nav>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <script>
  'use strict';
  const STORE='rezim-app-v1';
  const defaults={wake:'06:30',bed:'22:30',exercise:'17:30',pushups:25,squats:40,pullups:3,pullupDays:[1,3,5],runMinutes:20,runDays:[1,3,6],vitaminTime:'08:00',creatineTime:'09:00',vitaminEnabled:true,creatineEnabled:true,notifications:false};
  function load(){try{let v=JSON.parse(localStorage.getItem(STORE));return v && typeof v==='object'?v:{};}catch{return {};}}
  const state=load();state.settings={...defaults,...(state.settings||{})};state.days=state.days||{};state.run=state.run||{active:false,startedAt:null,elapsedMs:0};
  let tab='today',modal=null,challengeTaps=0,toastTimer=null,seenBedWarning=false,motivationStep=0,bibleStep=0;
  const $=s=>document.querySelector(s);
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){console.warn('Ukládání selhalo',e);}}
  function localKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
  function parseKey(k){let [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);}
  function shiftDay(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x;}
  function dayData(k=localKey()){let v=state.days[k]||{};return {wake:false,wakeStatus:null,wakeAt:'',bed:false,pushups:0,squats:0,pullups:0,minimum:false,runMinutes:0,runKm:0,runEntries:[],meals:[false,false,false],alcohol:null,vitamin:false,creatine:false,...v,wakeStatus:v.wakeStatus??(v.wake?'yes':null),runKm:Number.isFinite(Number(v.runKm))?Number(v.runKm):0,runEntries:Array.isArray(v.runEntries)?v.runEntries:[],meals:Array.isArray(v.meals)&&v.meals.length===3?v.meals:[false,false,false]};}
  function updateDay(fn){let k=localKey();let d={...dayData(k),meals:[...dayData(k).meals]};fn(d);state.days[k]=d;save();render();}
  function pct(value,max){return max<=0?100:Math.max(0,Math.min(100,Math.round(value/max*100)));}
  function runDay(date=new Date()){return state.settings.runDays.map(Number).includes(date.getDay());}
  function pullupDay(date=new Date()){return state.settings.pullupDays.map(Number).includes(date.getDay());}
  function computeScore(k){const d=dayData(k),s=state.settings,scheduled=runDay(parseKey(k));let pullScheduled=pullupDay(parseKey(k));let max=15+15+10+10+15+15+(scheduled?20:0)+(pullScheduled?10:0)+(s.vitaminEnabled?5:0)+(s.creatineEnabled?5:0);let base=(d.wake?15:0)+(d.bed?15:0)+(d.pushups>=s.pushups?10:0)+(d.squats>=s.squats?10:0)+(pullScheduled&&d.pullups>=s.pullups?10:0)+d.meals.filter(Boolean).length*5+(d.alcohol==='yes'?15:0)+(scheduled&&d.runMinutes>=s.runMinutes?20:0)+(s.vitaminEnabled&&d.vitamin?5:0)+(s.creatineEnabled&&d.creatine?5:0);let bonus=d.minimum?3:0;return {score:base+bonus,max,pct:pct(base,max),bonus};}
  function tasks(k){const d=dayData(k),s=state.settings;let checks=[!!d.wake,!!d.bed,d.pushups>=s.pushups,d.squats>=s.squats,...d.meals, d.alcohol==='yes'];if(s.vitaminEnabled)checks.push(!!d.vitamin);if(s.creatineEnabled)checks.push(!!d.creatine);if(runDay(parseKey(k)))checks.push(d.runMinutes>=s.runMinutes);if(pullupDay(parseKey(k)))checks.push(d.pullups>=s.pullups);return {done:checks.filter(Boolean).length,total:checks.length};}
  function streak(){let count=0;let d=new Date();if(dayData(localKey(d)).alcohol!=='yes')d=shiftDay(d,-1);for(let i=0;i<999;i++){if(dayData(localKey(d)).alcohol!=='yes')break;count++;d=shiftDay(d,-1);}return count;}
  function madeProgress(d){return !!(d.minimum||d.wakeStatus!==null||d.bed||d.pushups||d.squats||d.pullups||d.runMinutes||d.meals.some(Boolean)||d.alcohol==='yes'||d.vitamin||d.creatine);}
  function habitStreak(){let count=0,d=new Date();if(!madeProgress(dayData(localKey(d))))d=shiftDay(d,-1);for(let i=0;i<999;i++){if(!madeProgress(dayData(localKey(d))))break;count++;d=shiftDay(d,-1);}return count;}
  function lifetimePoints(){return Object.keys(state.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=localKey()).reduce((sum,k)=>sum+computeScore(k).score,0);}
  const rewardLevels=[{at:0,name:'První krok'},{at:150,name:'Držím směr'},{at:400,name:'Budovatel návyků'},{at:900,name:'Vytrvalec'},{at:1600,name:'Pevný režim'},{at:3000,name:'Mistr pravidelnosti'}];
  function levelInfo(points=lifetimePoints()){let ix=rewardLevels.reduce((n,v,i)=>points>=v.at?i:n,0);return {number:ix+1,name:rewardLevels[ix].name,next:rewardLevels[ix+1]?.at??null};}
  function activeDays(){return Object.keys(state.days).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&k<=localKey()&&madeProgress(dayData(k))).length;}
  function medalList(){let days=activeDays();return [[1,'První den'],[7,'Týden snahy'],[14,'Dva týdny'],[30,'Měsíc návyků'],[60,'Dlouhá cesta']].map(([need,label])=>`<span class="medal ${days>=need?'unlocked':''}">${days>=need?'🏅':'🔒'} ${label} · ${Math.min(days,need)}/${need}</span>`).join('');}
  function timeValid(t){return /^([01]\d|2[0-3]):[0-5]\d$/.test(t||'');}
  function prettyDate(date=new Date()){return new Intl.DateTimeFormat('cs-CZ',{weekday:'long',day:'numeric',month:'long'}).format(date);}
  function minutes(t){let [h,m]=t.split(':').map(Number);return h*60+m;}
  function formatMs(ms){let v=Math.max(0,Math.floor(ms/1000));return `${String(Math.floor(v/60)).padStart(2,'0')}:${String(v%60).padStart(2,'0')}`;}
  function currentRunMs(){return state.run.elapsedMs+(state.run.active&&state.run.startedAt?Date.now()-state.run.startedAt:0);}
  function localTime(){return new Date().toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});}
  function fmtKm(v){return Number(v||0).toLocaleString('cs-CZ',{maximumFractionDigits:2,minimumFractionDigits:2});}
  function mondayOfWeek(date=new Date()){let result=new Date(date.getFullYear(),date.getMonth(),date.getDate(),12);result.setDate(result.getDate()-((result.getDay()+6)%7));return result;}
  function dateIndex(date=new Date()){return Math.floor(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/86400000);}
  function addRun(km,duration,source){updateDay(v=>{v.runMinutes=Math.round((v.runMinutes+duration)*100)/100;v.runKm=Math.round((v.runKm+km)*100)/100;v.runEntries.push({km,minutes:duration,source,recordedAt:new Date().toISOString()});});}
  function runForm(d){return `<div class="run-record"><div class="field"><label>Zapsat běh – vzdálenost a čas</label></div><div class="settings-grid"><div class="field"><label for="runKmInput">Vzdálenost (km)</label><input id="runKmInput" type="number" min="0.01" max="200" step="0.01" inputmode="decimal" placeholder="např. 3,5" /></div><div class="field"><label for="runDurationInput">Čas běhu (minuty)</label><input id="runDurationInput" type="number" min="1" max="600" step="1" inputmode="numeric" placeholder="např. 25" /></div></div><button class="btn primary" data-action="runManualSave">Uložit vzdálenost a čas</button></div><p class="metric">Dnes: <strong>${fmtKm(d.runKm)} km</strong> · <strong>${d.runMinutes} min</strong></p>${d.runEntries.length?`<div class="run-log" aria-label="Zapsané běhy">${d.runEntries.map(entry=>`<span>${fmtKm(entry.km)} km · ${entry.minutes} min</span>`).join('')}</div>`:''}`;}
  function wakeForm(d,s){const status=d.wakeStatus;return `<div class="wake-row"><div class="field"><label for="wakeActualTime">Skutečný čas vstávání</label><input id="wakeActualTime" type="time" value="${esc(d.wakeAt||localTime())}" /></div></div><div class="actions"><button class="btn ${status==='yes'?'primary':'outline'}" data-action="wakeYes" aria-pressed="${status==='yes'}">${status==='yes'?'✓ Splnil':'Splnil'}</button><button class="btn ${status==='no'?'orange':'outline'}" data-action="wakeNo" aria-pressed="${status==='no'}">${status==='no'?'✓ Nesplnil':'Nesplnil'}</button><button class="btn outline" data-action="wakeChallenge">12 dotyků ☀️</button></div>${status?`<p class="metric" style="margin-bottom:0">${status==='yes'?'Splněno':'Nesplněno'} · skutečný čas: <b>${esc(d.wakeAt||'nezadán')}</b> · plán ${s.wake} <button class="btn mini outline" data-action="wakeClear" style="margin-left:7px">Zrušit záznam</button></p>`:''}`;}

  function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function toast(msg){const node=$('#toastRoot');node.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.innerHTML='',2800);}
  function habit(icon,title,description,content,done=false,status=''){return `<article class="habit ${done?'done':''}"><div class="emoji">${icon}</div><div><div class="head"><h3>${title}</h3><span class="status">${done?'✓ HOTOVO':status}</span></div><p>${description}</p>${content}</div></article>`;}
  function progressBar(value,max){return `<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="${max}" aria-valuenow="${Math.min(value,max)}"><span style="width:${pct(value,max)}%"></span></div>`;}

  const bibleVerses=[{"text":"Hospodin jest můj pastýř, nebudu míti nedostatku.","ref":"Žalm 23,1"},{"text":"Hospodin světlo mé a spasení mé, kohož se báti budu?","ref":"Žalm 27,1"},{"text":"Hospodin síla má a štít můj jest.","ref":"Žalm 28,7"},{"text":"Zmužile sobě počínejte, a posilní Bůh srdce vašeho.","ref":"Žalm 31,25"},{"text":"Blízký jest Hospodin těm, kteříž jsou srdce zkroušeného.","ref":"Žalm 34,19"},{"text":"Uval na Hospodina cestu svou, a slož v něm naději.","ref":"Žalm 37,5"},{"text":"Bůh jest naše útočiště i síla.","ref":"Žalm 46,2"},{"text":"Uvrz na Hospodina břímě své, a onť opatrovati tě bude.","ref":"Žalm 55,23"},{"text":"Jenom v Bohu odpočívá duše má.","ref":"Žalm 62,2"},{"text":"Tentoť jest den, kterýž učinil Hospodin.","ref":"Žalm 118,24"},{"text":"Svíce nohám mým jest slovo tvé, a světlo stezce mé.","ref":"Žalm 119,105"},{"text":"Doufej v Hospodina celým srdcem svým.","ref":"Přísloví 3,5"},{"text":"Uval na Hospodina skutky své.","ref":"Přísloví 16,3"},{"text":"Ti, kteříž očekávají na Hospodina, nabývají nové síly.","ref":"Izaiáš 40,31"},{"text":"Neboj se, nebo já s tebou jsem.","ref":"Izaiáš 41,10"},{"text":"Posilni se a zmužile se měj, neboj se, ani lekej.","ref":"Jozue 1,9"},{"text":"Blahoslavení pokojní, nebo oni synové Boží slouti budou.","ref":"Matouš 5,9"},{"text":"Protož nepečujte o zítřejší den.","ref":"Matouš 6,34"},{"text":"Proste, a dánoť bude vám; hledejte, a naleznete.","ref":"Matouš 7,7"},{"text":"Pojďtež ke mně všickni, kteříž pracujete a obtíženi jste.","ref":"Matouš 11,28"},{"text":"Neboť nebude nemožné u Boha všeliké slovo.","ref":"Lukáš 1,37"},{"text":"Já jsem světlo světa.","ref":"Jan 8,12"},{"text":"Pokoj zůstavuji vám, pokoj svůj dávám vám.","ref":"Jan 14,27"},{"text":"Nadějí se radujíce, v soužení trpěliví, na modlitbě trvajíce.","ref":"Římanům 12,12"},{"text":"Nyní pak zůstává víra, naděje, láska.","ref":"1. Korintským 13,13"},{"text":"Dostiť máš na mé milosti.","ref":"2. Korintským 12,9"},{"text":"Dobré činíce, neoblevujme.","ref":"Galatským 6,9"},{"text":"Všecko mohu v Kristu, kterýž mne posiluje.","ref":"Filipským 4,13"},{"text":"O nic nebuďte pečliví.","ref":"Filipským 4,6"},{"text":"Jestliže pak komu z vás nedostává se moudrosti, žádejž jí od Boha.","ref":"Jakubův 1,5"},{"text":"Všelikou péči svou uvrhouce na něj, nebo on má péči o vás.","ref":"1. Petrův 5,7"},{"text":"Nedal nám Bůh ducha bázně, ale moci a milování.","ref":"2. Timoteovi 1,7"},{"text":"Jist jsa tím, že ten, kterýž začal v vás dílo dobré, dokoná.","ref":"Filipským 1,6"},{"text":"A cožkoli činiti bude, šťastně mu se povede.","ref":"Žalm 1,3"},{"text":"Zůstávejte v lásce mé.","ref":"Jan 15,9"},{"text":"A setře Bůh všelikou slzu s očí jejich.","ref":"Zjevení 21,4"},{"text":"Plesejte v Hospodinu a veselte se, spravedliví.","ref":"Žalm 32,11"}];

  function todayView(){let d=dayData(),s=state.settings,t=tasks(localKey()),score=computeScore(localKey()),dayNumber=dateIndex(),allPoints=lifetimePoints(),level=levelInfo(allPoints),tipIndex=dayNumber%foodTips.length,quoteIndex=dayNumber%quotes.length,rd=runDay(),pd=pullupDay(),r=d.runMinutes;
    let out=`<header class="top"><div><div class="logo">REŽIM<span style="color:var(--orange)">.</span></div><h1 id="timeGreeting">${greetingForHour(new Date().getHours())}</h1><div class="sub">${prettyDate()}</div></div><div class="pill">🔥 ${streak()} dní bez alkoholu</div></header>
    <section class="hero"><div><div class="eyebrow">Dnešní mise</div><h2>${t.done} z ${t.total} splněno</h2><p>🌱 ${habitStreak()} dní děláš něco pro sebe</p><p>${t.done===t.total?'Skvělá práce. Dnešek máš za sebou.':'Každý odškrtnutý krok se počítá.'}</p></div><div class="progress-circle" style="background:conic-gradient(var(--mint) ${score.pct}%,#37485a 0)"><div><strong>${score.pct}%</strong><small>splněno</small></div></div></section>

    <div class="sectionTitle"><h2>Tvůj denní plán</h2><small>Uděláš to pro sebe</small></div><div class="stack">`;
    out+=habit('⏰','Ranní vstávání',`Plán ${s.wake}. Zapiš skutečný čas a označ, zda se ti podařilo vstát podle plánu.`,wakeForm(d,s),d.wakeStatus==='yes',d.wakeStatus==='no'?'NESPLNĚNO':'');
    out+=habit('💪','Kliky',`Dnešní cíl: ${s.pushups} kliků. Klidně po sériích.`,`${progressBar(d.pushups,s.pushups)}<div class="actions"><button class="btn mini outline" data-action="pushminus" aria-label="Odečíst pět kliků">−5</button><button class="btn mini" data-action="pushplus">+5</button><button class="btn primary" data-action="pushone">+1</button><span class="metric">${d.pushups} / ${s.pushups}</span></div>`,d.pushups>=s.pushups);
    out+=habit('🦵','Dřepy',`Dnešní cíl: ${s.squats} dřepů. Kvalita pohybu je důležitější než rychlost.`,`${progressBar(d.squats,s.squats)}<div class="actions"><button class="btn mini outline" data-action="squatminus" aria-label="Odečíst pět dřepů">−5</button><button class="btn mini" data-action="squatplus">+5</button><button class="btn primary" data-action="squatone">+1</button><span class="metric">${d.squats} / ${s.squats}</span></div>`,d.squats>=s.squats);
    if(pd){out+=habit('🏋️','Shyby',`Plánovaný trénink: ${s.pullups} shybů. Počítají se i shyby s dopomocí; důležitá je správná technika.`,`${progressBar(d.pullups,s.pullups)}<div class="actions"><button class="btn mini outline" data-action="pullminus" aria-label="Odečíst jeden shyb">−1</button><button class="btn mini" data-action="pullplus">+1</button><button class="btn primary" data-action="pullfive">+5</button><span class="metric">${d.pullups} / ${s.pullups}</span></div>`,d.pullups>=s.pullups);}else{out+=habit('🏋️','Shyby – odpočinek','Dnes shyby nemusíš dělat. Regenerace pomáhá budovat dlouhodobý návyk.',`<div class="actions"><button class="btn outline" data-action="pullplus">Dobrovolně +1</button><span class="metric">${d.pullups} shybů</span></div>`,true,'VOLITELNÉ');}
    if(rd){out+=habit('🏃','Běh',`Běžecký den. Cíl ${s.runMinutes} minut. Zapisuj čas i počet kilometrů.`,`${progressBar(r,s.runMinutes)}<div class="actions"><button class="btn ${state.run.active?'orange':'primary'}" data-action="runToggle">${state.run.active?'⏸ Pozastavit':currentRunMs()>0?'▶ Pokračovat':'▶ Spustit stopky'}</button><span class="metric" id="runTimer">${formatMs(currentRunMs())}</span></div><div class="run-record"><div class="field"><label for="runTimerKm">Vzdálenost ze stopek (km)</label><input id="runTimerKm" type="number" min="0.01" max="200" step="0.01" inputmode="decimal" placeholder="např. 3,5" /></div><div class="actions" style="margin-top:9px"><button class="btn outline" data-action="runFinish">Uložit stopky + km</button></div></div>${runForm(d)}`,r>=s.runMinutes);}else{out+=habit('🌿','Regenerace / dobrovolný běh','Dnes není plánovaný běh. Můžeš odpočívat nebo zapsat dobrovolný běh.',runForm(d),true,'VOLITELNÉ');}
    let mealNames=['Snídaně','Oběd','Večeře'];out+=habit('🥗','Jíst dobře','Zaškrtni jídla, u kterých ses držel svého rozumného plánu.',`<div class="food-grid">${mealNames.map((name,i)=>`<button class="food-button ${d.meals[i]?'yes':''}" data-action="meal" data-index="${i}" aria-pressed="${d.meals[i]}">${d.meals[i]?'✓ ':''}${name}</button>`).join('')}</div>`,d.meals.every(Boolean));

    if(s.creatineEnabled)out+=habit('🥄','Kreatin',`Připomenutí ${s.creatineTime}. Dávkování podle vlastního režimu nebo doporučení odborníka.`,`<div class="actions"><button class="btn ${d.creatine?'outline':'primary'}" data-action="creatineToggle">${d.creatine?'✓ Kreatin zaznamenán':'Dnes mám kreatin'}</button><span class="metric">+5 bodů</span></div>`,!!d.creatine);
    out+=habit('🚫','Den bez alkoholu','Rozhodnutí bez alkoholu děláš dnes. Zítra znovu.',`<div class="actions"><button class="btn ${d.alcohol==='yes'?'primary':''}" data-action="alcoholYes">${d.alcohol==='yes'?'✓ Bez alkoholu':'Dnes bez alkoholu'}</button><button class="btn ${d.alcohol==='no'?'red':'outline'}" data-action="alcoholNo">Pil jsem</button><button class="btn outline" data-action="craving">Mám chuť</button></div>${d.alcohol==='no'?'<p>Nevadí, že dnešek nebyl podle plánu. Rozhodnutí zítra je stále tvoje.</p>':''}`,d.alcohol==='yes');
    out+=habit('🌙','Jít včas spát',`Zhasnout kolem ${s.bed}. Odlož displej a připrav se na spánek.`,`<div class="actions"><button class="btn ${d.bed?'outline':'primary'}" data-action="bed">${d.bed?'✓ Připraven na spánek':'Odkládám mobil, jdu spát'}</button></div>`,!!d.bed);
    out+=habit('✨','Záchranné minimum','Nestíháš? Udělej 2 kliky, 5 dřepů a 5 minut chůze. Potom označ.',`<div class="actions"><button class="btn ${d.minimum?'outline':'primary'}" data-action="minimum">${d.minimum?'✓ Svoje minimum jsem zvládl':'Splnil jsem malé minimum'}</button></div><p>Malé minimum posílí řadu konzistence, nenahrazuje ostatní úkoly.</p>`,!!d.minimum);
    out+=`</div>${bibleCard()}<div class="tip"><span style="font-size:26px">💡</span><div><b>Tip na jídlo</b><p>${foodTips[tipIndex]}</p></div></div><div class="tip" style="background:#1b2636;border-color:#35475d"><span style="font-size:25px">⚡</span><div><b>3 motivační motta na dnešek</b><div class="daily-mottos" style="margin-top:12px"><p class="daily-motto">${quotes[quoteIndex]}</p><p class="daily-motto">${quotes[(quoteIndex+19)%quotes.length]}</p><p class="daily-motto">${quotes[(quoteIndex+39)%quotes.length]}</p></div><div class="actions" style="margin-top:12px"><button class="btn outline" data-action="anotherMotto">✨ Další povzbuzení</button></div>${motivationStep?`<p class="quote">${quotes[(quoteIndex+motivationStep+7)%quotes.length]}</p>`:''}</div></div><p class="footer-note">Údaje se ukládají jen do tohoto prohlížeče. Žádné účty, žádné reklamy.</p>`;
    return out;
  }
  function weekView(){let monday=mondayOfWeek(),list=Array.from({length:7},(_,i)=>shiftDay(monday,i));let
    total=list.reduce((a,d)=>a+computeScore(localKey(d)).score,0),runKm=list.reduce((sum,date)=>sum+dayData(localKey(date)).runKm,0),runMin=list.reduce((sum,date)=>sum+dayData(localKey(date)).runMinutes,0);
    let formatDate=date=>new Intl.DateTimeFormat('cs-CZ',{day:'numeric',month:'numeric'}).format(date);
    return `<header class="top"><div><div class="logo">REŽIM.</div><h1>Pokrok, ne dokonalost.</h1><div class="sub">Tento týden · pondělí až neděle (${formatDate(monday)}–${formatDate(list[6])})</div></div></header><section class="panel"><h2>Plnění denního plánu</h2><div class="week-grid">${list.map(date=>{let k=localKey(date),v=computeScore(k).pct;return `<div class="week-day"><b>${v}%</b><div class="bar-bg"><div class="bar" style="height:${v}%"></div></div><label>${new Intl.DateTimeFormat('cs-CZ',{weekday:'short'}).format(date)}</label></div>`;}).join('')}</div><p class="help">Týden vždy začíná v pondělí. Nezapsané dny mají 0 %; budoucí dny zatím na splnění čekají.</p></section><div class="statrow"><div class="stat"><b>${total}</b><small>bodů / týden</small></div><div class="stat"><b>${list.filter(date=>madeProgress(dayData(localKey(date)))).length}/7</b><small>dní se záznamem</small></div><div class="stat"><b>${streak()}</b><small>dní bez alkoholu</small></div></div><section class="panel"><h2>🏆 Body a odměny</h2><div class="row-between"><div><b style="font-size:26px">${lifetimePoints()} bodů</b><div class="sub">Celkem od začátku</div></div><div><b style="font-size:22px">Úroveň ${levelInfo().number}</b><div class="sub">${esc(levelInfo().name)}</div></div></div><div class="divider"></div><p class="sub">Odznaky za aktivní dny (${activeDays()} dní)</p><div class="medals">${medalList()}</div><p class="help">Žádné ztracené body za vynechání. Body se počítají ze splněných úkolů jen jednou za den. Změna cíle může přepočítat i starší dny.</p></section><section class="panel"><h2>🏃 Běh za tento týden</h2><div class="row-between"><div><b style="font-size:26px">${fmtKm(runKm)} km</b><div class="sub">Uběhnutá vzdálenost</div></div><div><b style="font-size:26px">${Math.round(runMin*100)/100} min</b><div class="sub">Celkový čas</div></div></div></section><section class="panel"><h2>Co funguje?</h2><p class="muted">Sleduj pravidelnost vstávání, pohybu, jídla i dnů bez alkoholu. Den, kdy zapíšeš „Nesplnil“, není důvod přestat. Důležité je pokračovat.</p></section>`;

  function settingsView(){let s=state.settings;const inputs=[['wake','Čas vstávání','time',s.wake],['bed','Čas spánku','time',s.bed],['exercise','Čas cvičení','time',s.exercise],['pushups','Kliky / den','number',s.pushups],['squats','Dřepy / den','number',s.squats],['pullups','Shyby / trénink','number',s.pullups],['runMinutes','Běh / minuty','number',s.runMinutes]];

    <div class="divider"></div><div class="field"><label>Běžecké dny</label><div class="day-checks">${[['Po',1],['Út',2],['St',3],['Čt',4],['Pá',5],['So',6],['Ne',0]].map(([name,i])=>`<label><input name="runDay" type="checkbox" value="${i}" ${s.runDays.map(Number).includes(i)?'checked':''} />${name}</label>`).join('')}</div></div>
    <div class="divider"></div><div class="field"><label>Dny na shyby (doporučené rozestupy kvůli regeneraci)</label><div class="day-checks">${[['Po',1],['Út',2],['St',3],['Čt',4],['Pá',5],['So',6],['Ne',0]].map(([name,i])=>`<label><input name="pullupDay" type="checkbox" value="${i}" ${s.pullupDays.map(Number).includes(i)?'checked':''} />${name}</label>`).join('')}</div></div>
    <div class="divider"></div><h2>Vitamíny a kreatin</h2><p class="help">Dobrovolné připomínky podle tvého režimu. Aplikace neurčuje dávkování ani neposuzuje, jestli doplňky potřebuješ.</p><div class="supplement-settings"><div class="supplement-line"><label><input type="checkbox" name="vitaminEnabled" ${s.vitaminEnabled?'checked':''} /> Připomínat vitamíny</label><div class="field"><label for="s_vitaminTime">Čas</label><input type="time" name="vitaminTime" id="s_vitaminTime" value="${esc(s.vitaminTime)}" required /></div></div><div class="supplement-line"><label><input type="checkbox" name="creatineEnabled" ${s.creatineEnabled?'checked':''} /> Připomínat kreatin</label><div class="field"><label for="s_creatineTime">Čas</label><input type="time" name="creatineTime" id="s_creatineTime" value="${esc(s.creatineTime)}" required /></div></div></div>
    <div class="divider"></div><button type="submit" class="btn primary w-full">Uložit můj plán</button></section></form>
    <section class="panel"><h2>Připomínky a budíky</h2><p class="muted">Při otevřené aplikaci tě upozorníme na vstávání, pohyb, spánek, vitamíny a kreatin (pokud máš připomínky zapnuté). Pro spolehlivější upozornění se zamčeným telefonem přidej události do kalendáře nebo nastav budíky v telefonu.</p><div class="actions"><button class="btn ${s.notifications?'primary':'outline'}" data-action="notifications">${s.notifications?'✓ Upozornění při otevřené aplikaci':'Zapnout upozornění v aplikaci'}</button><button class="btn outline" data-action="calendar">📅 Export do kalendáře (.ics)</button></div><p class="help">Upozornění webové aplikace nejsou náhradou systémového budíku.</p></section>
    <section class="panel"><h2>Záloha dat</h2><p class="muted">Záznamy zůstávají v tomto zařízení. Zálohu si můžeš uložit a později importovat.</p><div class="actions"><button class="btn outline" data-action="export">Stáhnout zálohu</button><button class="btn outline" data-action="import">Nahrát zálohu</button><button class="btn red" data-action="reset">Smazat všechna data</button></div><input type="file" id="importFile" accept="application/json,.json" class="hidden" /></section>`;
  }
  function render(){const root=$('#app');root.innerHTML=tab==='today'?todayView():tab==='week'?weekView():settingsView();$('#nav').innerHTML=[['today','☀️','Dnes'],['week','📈','Týden'],['settings','⚙️','Nastavení']].map(([id,ico,label])=>`<button class="tab ${tab===id?'active':''}" data-action="tab" data-tab="${id}" ${tab===id?'aria-current="page"':''}><span>${ico}</span>${label}</button>`).join('');renderModal();}
  function renderModal(){const root=$('#modalRoot');if(!modal){root.innerHTML='';return;}if(modal==='wake')root.innerHTML=`<div class="modal-overlay" role="dialog" aria-modal="true" aria-label="Ranní výzva"><div class="modal"><div class="big">☀️</div><h2>Vstávej. Dneska to dáš.</h2><p>Probuď tělo. Dotkni se kruhu 12× a pak vstaň z postele.</p><button class="tap" data-action="challengeTap">KLIKNI!</button><div class="counter">${challengeTaps} / 12</div><button class="btn outline" style="margin-top:18px" data-action="closeModal">Zavřít</button></div></div>`;
    if(modal==='craving'){let until=state.cravingUntil||0;let remaining=Math.max(0,until-Date.now());root.innerHTML=`<div class="modal-overlay" role="dialog" aria-modal="true" aria-label="Podpora při chuti na alkohol"><div class="modal"><div class="big">🧊</div><h2>Chuť není povinnost.</h2><p>Dej si sklenici vody, změň prostředí a odlož rozhodnutí o 10 minut. Zkus krátkou procházku nebo zavolej někomu blízkému.</p><div class="counter" id="cravingTimer" style="font-size:31px;margin:12px">${remaining?formatMs(remaining):'10:00'}</div><button class="btn primary" data-action="cravingStart">${remaining?'Restart 10 minut':'Start 10 minut'}</button><button class="btn outline" style="margin-left:8px" data-action="closeModal">Zavřít</button><p class="help">Pokud piješ hodně a pravidelně, náhlé vysazení alkoholu může být zdravotně rizikové. V takovém případě požádej o pomoc lékaře.</p></div></div>`;}
  }
  function showModal(kind){modal=kind;challengeTaps=0;renderModal();}
  function download(name,content,type){let blob=new Blob([content],{type});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
  function icsDate(date,hhmm){return `${date.getFullYear()}${String(date.getMonth()+1).padStart(2,'0')}${String(date.getDate()).padStart(2,'0')}T${hhmm.replace(':','')}00`;}
  function icsExport(){let start=shiftDay(new Date(),1);let dt=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');let s=state.settings;function event(id,title,time,rule,trigger='-PT0M',eventStart=start){return ['BEGIN:VEVENT',`UID:rezim-${id}-${Date.now()}@rezim.local`,`DTSTAMP:${dt}`,`DTSTART:${icsDate(eventStart,time)}`,`SUMMARY:${title}`,`DESCRIPTION:REŽIM – splň dnešní plán.`,`RRULE:${rule}`,'BEGIN:VALARM',`TRIGGER:${trigger}`,'ACTION:DISPLAY',`DESCRIPTION:${title}`,'END:VALARM','END:VEVENT'];}
    let days=s.runDays.map(v=>['SU','MO','TU','WE','TH','FR','SA'][v]).join(',');let items=[...event('wake','REŽIM: Vstát a ranní výzva',s.wake,'FREQ=DAILY'),...event('exercise','REŽIM: Kliky, dřepy a shyby podle plánu',s.exercise,'FREQ=DAILY'),...event('bed','REŽIM: Připravit se na spánek',s.bed,'FREQ=DAILY','-PT30M')];if(s.vitaminEnabled)items.push(...event('vitamin','REŽIM: Vitamíny – podle plánu',s.vitaminTime,'FREQ=DAILY'));if(s.creatineEnabled)items.push(...event('creatine','REŽIM: Kreatin – podle plánu',s.creatineTime,'FREQ=DAILY'));if(days){let firstRun=shiftDay(start,0);while(!s.runDays.map(Number).includes(firstRun.getDay()))firstRun=shiftDay(firstRun,1);items.push(...event('run','REŽIM: Běh',s.exercise,`FREQ=WEEKLY;BYDAY=${days}`,'-PT0M',firstRun));}let ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//REZIM//Discipline//CS','CALSCALE:GREGORIAN',...items,'END:VCALENDAR'].join('\r\n');download('rezim-pripominky.ics',ics,'text/calendar;charset=utf-8');toast('Kalendář připraven ke stažení.');}
  async function notifyPermission(){if(!('Notification' in window)){toast('Oznámení nejsou v tomto prohlížeči dostupná.');return false;}try{return (await Notification.requestPermission())==='granted';}catch{return false;}}
  function foregroundReminder(title,body){if(document.visibilityState==='visible' && 'Notification' in window && Notification.permission==='granted'){try{new Notification(title,{body,icon:'icons/icon-192.png'});return;}catch(e){}}toast(`${title}: ${body}`);}
  function reminderTick(){if(!state.settings.notifications||document.visibilityState!=='visible')return;let n=new Date(),hh=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0'),today=localKey(n);let s=state.settings;let reminders=[['wake',s.wake,'Vstávej! ☀️','Otevři REŽIM a splň ranní výzvu.'],['exercise',s.exercise,'Čas na pohyb: kliky, dřepy, shyby 💪','Malá série je lepší než žádná.'],['bed',s.bed,'Čas na spánek 🌙','Odlož obrazovku a připrav se na zítřek.']];if(s.vitaminEnabled)reminders.push(['vitamin',s.vitaminTime,'Vitamíny ☀️','Připomínka podle tvého plánu.']);if(s.creatineEnabled)reminders.push(['creatine',s.creatineTime,'Kreatin 🥄','Připomínka podle tvého plánu.']);for(const [id,time,title,body] of reminders){let key=`${today}_${id}`;if(hh===time&&!state.lastAlerts?.[key]){state.lastAlerts=state.lastAlerts||{};state.lastAlerts[key]=true;save();foregroundReminder(title,body);if(id==='wake'&&!dayData().wake&&tab==='today'&&!modal)showModal('wake');}}}
  function updateLive(){let greeting=$('#timeGreeting');if(greeting){let value=greetingForHour(new Date().getHours());if(greeting.textContent!==value)greeting.textContent=value;}let timer=$('#runTimer');if(timer)timer.textContent=formatMs(currentRunMs());if(modal==='craving'&&$('#cravingTimer'))$('#cravingTimer').textContent=state.cravingUntil?formatMs(Math.max(0,state.cravingUntil-Date.now())):'10:00';if(localKey()!==lastRenderedDay){lastRenderedDay=localKey();render();}reminderTick();}
  let lastRenderedDay=localKey();
  document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,d=dayData(),s=state.settings;if(a==='tab'){tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'smooth'});return;}
    if(a==='wakeYes'||a==='wakeNo'){let value=$('#wakeActualTime')?.value;if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(value||'')){toast('Nejprve zadej skutečný čas vstávání.');return;}let yes=a==='wakeYes';updateDay(v=>{v.wake=yes;v.wakeStatus=yes?'yes':'no';v.wakeAt=value;});toast(yes?'Vstávání zapsáno jako splněné. Jen tak dál!':'Nesplněno zapsáno. Zítra máš další šanci.');return;}
    if(a==='wakeClear'){updateDay(v=>{v.wake=false;v.wakeStatus=null;v.wakeAt='';});return;}
    if(a==='wakeChallenge'){showModal('wake');return;}
    if(a==='challengeTap'){challengeTaps++;if(challengeTaps>=12){modal=null;let now=new Date(),actual=now.getHours()*60+now.getMinutes(),target=minutes(s.wake);updateDay(v=>{v.wake=true;v.wakeStatus='yes';v.wakeAt=$('#wakeActualTime')?.value||localTime();});toast(actual<=target+30&&actual>=target-60?'Vstávání splněno! Dobré ráno.':'Výzva splněna. Zítra zkus dodržet čas vstávání.');}else renderModal();return;}
    if(a==='closeModal'){modal=null;renderModal();return;}
    if(a==='pushplus'||a==='pushminus'||a==='pushone'){updateDay(v=>v.pushups=Math.max(0,v.pushups+(a==='pushplus'?5:a==='pushminus'?-5:1)));return;}
    if(a==='squatplus'||a==='squatminus'||a==='squatone'){updateDay(v=>v.squats=Math.max(0,v.squats+(a==='squatplus'?5:a==='squatminus'?-5:1)));return;}
    if(a==='pullplus'||a==='pullminus'||a==='pullfive'){updateDay(v=>v.pullups=Math.max(0,v.pullups+(a==='pullplus'?1:a==='pullminus'?-1:5)));return;}
    if(a==='minimum'){updateDay(v=>v.minimum=!v.minimum);return;}
    if(a==='anotherVerse'){bibleStep=(bibleStep+1)%bibleVerses.length;render();return;}
    if(a==='vitaminToggle'){updateDay(v=>v.vitamin=!v.vitamin);return;}
    if(a==='creatineToggle'){updateDay(v=>v.creatine=!v.creatine);return;}
    if(a==='anotherMotto'){motivationStep=(motivationStep+1)%quotes.length;render();return;}
    if(a==='meal'){let i=Number(b.dataset.index);updateDay(v=>v.meals[i]=!v.meals[i]);return;}
    if(a==='alcoholYes'){updateDay(v=>v.alcohol=v.alcohol==='yes'?null:'yes');return;}
    if(a==='alcoholNo'){updateDay(v=>v.alcohol=v.alcohol==='no'?null:'no');return;}
    if(a==='bed'){updateDay(v=>v.bed=!v.bed);return;}
    if(a==='runToggle'){if(state.run.active){state.run.elapsedMs=currentRunMs();state.run.active=false;state.run.startedAt=null;}else{state.run.active=true;state.run.startedAt=Date.now();}save();render();return;}
    if(a==='runFinish'){let mins=Math.round(currentRunMs()/60000),km=Number($('#runTimerKm')?.value);if(mins<1){toast('Pro uložení běhu nech stopky běžet alespoň minutu.');return;}if(!Number.isFinite(km)||km<=0||km>200){toast('Zadej vzdálenost v km (0,01 až 200).');return;}state.run={active:false,startedAt:null,elapsedMs:0};addRun(Math.round(km*100)/100,mins,'stopky');toast(`Běh uložen: ${fmtKm(km)} km za ${mins} min.`);return;}
    if(a==='runManualSave'){let km=Number($('#runKmInput')?.value),mins=Number($('#runDurationInput')?.value);if(!Number.isFinite(km)||km<=0||km>200||!Number.isInteger(mins)||mins<1||mins>600){toast('Vyplň vzdálenost 0,01–200 km a čas 1–600 minut.');return;}addRun(Math.round(km*100)/100,mins,'ručně');toast(`Zapsáno ${fmtKm(km)} km za ${mins} min. Skvělá práce!`);return;}
    if(a==='craving'){showModal('craving');return;}
    if(a==='cravingStart'){state.cravingUntil=Date.now()+10*60000;save();renderModal();toast('Začíná desetiminutová pauza.');return;}
    if(a==='notifications'){if(s.notifications){s.notifications=false;save();render();toast('Upozornění vypnuta.');}else{let allowed=await notifyPermission();s.notifications=true;save();render();toast(allowed?'Upozornění zapnuta při otevřené aplikaci.':'Připomínky uvidíš jen při otevřené aplikaci.');}return;}
    if(a==='calendar'){icsExport();return;}
    if(a==='export'){download(`rezim-zaloha-${localKey()}.json`,JSON.stringify({settings:state.settings,days:state.days},null,2),'application/json');toast('Záloha stažena.');return;}
    if(a==='import'){$('#importFile').click();return;}
    if(a==='reset'){if(confirm('Opravdu smazat celý plán a historii? Tuto akci nelze vrátit.')){localStorage.removeItem(STORE);location.reload();}return;}
  });
  document.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();let form=new FormData(e.target),v={...state.settings};for(let f of ['wake','bed','exercise'])v[f]=String(form.get(f));for(let f of ['pushups','squats','pullups','runMinutes']){let n=Number(form.get(f));if(!Number.isInteger(n)||n<1||n>500){toast('Cíle musí být celé číslo od 1 do 500.');return;}v[f]=n;}v.runDays=form.getAll('runDay').map(Number);v.pullupDays=form.getAll('pullupDay').map(Number);v.vitaminEnabled=form.has('vitaminEnabled');v.creatineEnabled=form.has('creatineEnabled');v.vitaminTime=String(form.get('vitaminTime')||'');v.creatineTime=String(form.get('creatineTime')||'');if(!timeValid(v.vitaminTime)||!timeValid(v.creatineTime)){toast('Nastav platné časy připomínek.');return;}state.settings=v;save();toast('Plán uložen. Teď ho můžeš splnit.');tab='today';render();});
  document.addEventListener('change',async e=>{if(e.target.id!=='importFile')return;let f=e.target.files[0];if(!f)return;try{let json=JSON.parse(await f.text());if(!json||typeof json!=='object'||!json.days||!json.settings||!confirm('Nahrát zálohu? Současná historie bude nahrazena.'))return;state.days=json.days;state.settings={...defaults,...json.settings};state.run={active:false,startedAt:null,elapsedMs:0};save();render();toast('Záloha nahrána.');}catch{toast('Soubor není platná záloha REŽIM.');}});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')updateLive();});
  render();setInterval(updateLive,1000);
  if('serviceWorker' in navigator&&location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
  </script>
</body>
